name: CI

on:
  push:
  pull_request:

jobs:
  lean-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch dependencies
        run: lake update
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build kernel
        run: lake build
      - name: Placeholder sensor (must be zero hits)
        run: |
          ! grep -rnE '\bsorry\b|\badmit\b|\bunsafe\b|^axiom\b' --include='*.lean' --exclude-dir=.lake .

  z3-tribunal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install z3-solver
        run: pip install z3-solver
      - name: Batch 1 (exit code gates)
        run: python z3_tribunal/anti_turing_tribunal.py
      - name: Batch 2 (exit code gates)
        run: python z3_tribunal/anti_turing_batch2.py
